# GPT-OSS packed-RL parity fixture.
# Intended for explicit 8-GPU runs only: 4 GPUs for vLLM, 4 GPUs for TorchTitan.

group_size: 2
batch_size: 2
max_req_tokens: 256
max_res_tokens: 32
model: "openai/gpt-oss-20b"
compile: false

generator:
  engine_args:
    model: ${model}
    tensor_parallel_size: 4
    pipeline_parallel_size: 1
    enforce_eager: true
    max_model_len: ${sum:${max_req_tokens},${max_res_tokens}}
  sampling_params:
    n: ${group_size}
    max_tokens: ${max_res_tokens}
    temperature: 1.0
    top_p: 1.0
    logprobs: 1

trainer:
  model:
    name: gpt_oss
    flavor: 20b
    hf_assets_path: hf://${model}
  optimizer:
    name: AdamW
    lr: 1e-5
    eps: 1e-8
  lr_scheduler:
    warmup_steps: 1
  training:
    local_batch_size: ${batch_size}
    seq_len: ${sum:${max_req_tokens},${max_res_tokens}}
    max_norm: 1.0
    steps: 1
    dtype: bfloat16
    gc_freq: 1
  compile:
    enable: false
  parallelism:
    data_parallel_replicate_degree: 1
    data_parallel_shard_degree: 1
    tensor_parallel_degree: 4
    pipeline_parallel_degree: 1
    context_parallel_degree: 1
    expert_parallel_degree: 1
    disable_loss_parallel: true
  checkpoint:
    enable: true
    initial_load_path: hf://${model}
    initial_load_in_hf: true
    last_save_in_hf: true
    interval: 500
    async_mode: "disabled"
  activation_checkpoint:
    mode: selective
    selective_ac_option: op

services:
  generator:
    procs: ${generator.engine_args.tensor_parallel_size}
    num_replicas: 1
    with_gpus: true

actors:
  trainer:
    procs: ${trainer.parallelism.tensor_parallel_degree}
    num_replicas: 1
    with_gpus: true
